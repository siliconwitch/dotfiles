onboarding = false

[ui]
tab_bar_right_separator = " "

# Battery level, hidden while plugged in at 80% or above.
# Nerd Font glyphs:  is a battery,  is a plug.
[[ui.tab_bar_right]]
type = "command"
command = """
level=$(cat /sys/class/power_supply/BAT0/capacity)

if [ "$(cat /sys/class/power_supply/BAT0/status)" = Discharging ]; then
  echo "$level% "
elif [ "$level" -lt 80 ]; then
  echo "$level% "
fi
"""
interval_seconds = 5
timeout_seconds = 2

[[ui.tab_bar_right]]
type = "datetime"
format = "%H:%M"

# zsh/prompt.zsh reports $git_branch: the branch name, then + if staged and * if unstaged or untracked.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["$git_branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+a"

# Yazi as a popup file browser. Inside yazi, W opens the hovered folder as a
# new Herdr workspace (see yazi/keymap.toml).
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "yazi \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\""
width = "80%"
height = "80%"
description = "file browser"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr diff pane"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "nvim file picker"
