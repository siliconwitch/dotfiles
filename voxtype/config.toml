# Voxtype settings. Every other option uses its default; see
# share/voxtype/default-config.toml in the package or `voxtype config schema`.

engine = "parakeet"

[parakeet]
model = "parakeet-tdt-0.6b-v2"

[output]
# See configuration.nix for why ydotool and not wtype
driver_order = ["ydotool", "clipboard"]

[output.notification]
on_transcription = false

# The nixpkgs build lacks the GTK overlay and the Quickshell files, so the
# overlay can only fail
[osd]
enabled = false

# Matches whole words, ignoring case. Keys must not overlap, because the
# order replacements run in is not fixed.
[text.replacements]
